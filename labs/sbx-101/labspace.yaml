title: "Intro to Docker Sandboxes (SBX 101)"
description: "The SBX 101 workshop, fully simulated in your browser."

simulator: simulator.yaml

# Two terminal tabs, like the real workshop: A is where you attach to the
# agent, B stays a host shell so you can watch policy logs while the agent works.
terminals:
  - id: a
    title: Terminal A
    icon: terminal
  - id: b
    title: Terminal B
    icon: dns

# The `track` variable drives the two explanation tracks, chosen on the
# "Start here" page: "tech" keeps the terse voice, "guided" adds
# plain-language context blocks. Unset until the learner picks; the base
# text IS the technical track, so the lab reads fine either way.

# The virtual filesystem represents ~/workshop on your machine.
files:
  sbx/README.txt: |
    This directory (~/workshop/sbx) is your sandbox workspace.
    It is the ONLY directory the agent can see.

sections:
  - title: Start here
    contentPath: start-here.md
  - title: Introduction
    contentPath: 00-setup.md
  - title: "Step 1 — Your first sandbox"
    contentPath: 01-first-sandbox.md
  - title: "Step 2 — Isolation proof"
    contentPath: 02-isolation.md
  - title: "Step 3 — Network policy"
    contentPath: 03-network-policy.md
  - title: "Step 4 — Tools via MCP"
    contentPath: 04-mcp.md
  - title: "Step 5 — Hardened output (DHI)"
    contentPath: 05-dhi.md
  - title: "Step 6 — Standardize with Kits"
    contentPath: 06-kits.md
  - title: Wrap-up
    contentPath: 07-wrap.md

# Note: many sites (docs.docker.com included) send X-Frame-Options/CSP headers
# that refuse iframe embedding — so the tab shows our own reference page,
# served with the lab (same-origin), with links out to the real docs.
services:
  - id: docs
    title: Reference
    icon: menu_book
    url: lab/resources.html
